services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rask
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: rask
    ports:
      - "5432:5432"
    volumes:
      - rask_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rask"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rask_data: